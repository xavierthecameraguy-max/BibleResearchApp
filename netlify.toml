[build]
  command = "npm run build"
  publish = "dist"

# The build tools need Node 22 or newer.
[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The Bible proxy (licensed translations such as the NKJV, ESV and NLT).
[[redirects]]
  from = "/api/bible/*"
  to = "/.netlify/functions/bible/:splat"
  status = 200

# Send every page address to the app so links and refreshes work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
